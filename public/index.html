<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Song Book</title>
<meta name="description" content="Song lyrics written with number chords.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav">
  <a class="brand" href="#/" aria-label="Song Book home">
    <!-- G clef -->
    <img src="/images/Logo.png" alt="Song Book logo">
    <span>Song Book</span>
  </a>
  <div class="nav-links" id="nav-links"></div>
</nav>

<main id="view"></main>

<!-- Footnote player, fixed to the bottom of every screen. Holds the YouTube
     video for whichever song is open; empty and inert everywhere else. -->
<footer class="player" id="player">
  <div class="player-video" id="player-video">
    <div class="player-video-empty" id="player-video-empty" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16v12H4z"/><path d="M9 9.5l6 2.5-6 2.5z"/></svg>
    </div>
  </div>
  <div class="player-meta">
    <div class="t" id="player-title">Nothing playing</div>
    <div class="s" id="player-singer"></div>
  </div>
  <div class="player-note" id="player-note"></div>
  <a class="player-open" id="player-open" href="#" target="_blank" rel="noopener">Open in YouTube ↗</a>
</footer>

<script src="/js/chords.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
