<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Song Book</title>
<meta name="description" content="Song lyrics written with number chords.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="nav">
  <a class="brand" href="#/" aria-label="Song Book home">
    <!-- G clef -->
    <img src="/images/Logo.png" alt="Song Book logo">
    <span>Song Book</span>
  </a>
  <div class="nav-links" id="nav-links"></div>
</nav>

<main id="view"></main>

<!-- Footnote player, fixed to the bottom of every screen -->
<footer class="player" id="player">
  <button class="player-play" id="player-play" disabled aria-label="Play"></button>
  <div class="player-meta">
    <div class="t" id="player-title">Nothing playing</div>
    <div class="s" id="player-singer"></div>
  </div>
  <div class="player-bar">
    <input type="range" id="player-range" min="0" max="100" value="0" step="0.1" disabled aria-label="Seek">
    <span class="player-time" id="player-time">0:00 / 0:00</span>
    <span class="player-time" id="player-note"></span>
  </div>
  <audio id="audio" preload="none"></audio>
</footer>

<script src="/js/chords.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
